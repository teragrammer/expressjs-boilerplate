services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PORT: ${PORT}
    image: express-boilerplate/backend:latest
    container_name: express-boilerplate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      EMAIL_ENABLED: "false"
    ports:
      - "${PORT_EXPOSE}:${PORT}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:process.env.PORT||4000,path:'/health/live',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
