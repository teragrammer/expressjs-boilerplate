services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: express-boilerplate/backend:latest
    container_name: express-boilerplate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${PORT_EXPOSE}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:process.env.PORT||4000,path:'/health/live',timeout:4000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - expressjs-boilerplate-network

  # Local development dependencies.
  #
  # Production deployments use managed PostgreSQL and Redis; these
  # services exist so `docker compose up` yields a working stack.
  postgres:
    image: postgres:18.6-trixie
    container_name: express-boilerplate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-express_api}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expressjs-boilerplate-network

  redis:
    image: redis:8-alpine
    container_name: express-boilerplate-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expressjs-boilerplate-network

volumes:
  postgres-data:
  redis-data:

networks:
  expressjs-boilerplate-network:
    name: expressjs-boilerplate-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"
